<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Countdown</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <!-- حاوية الفيديو العمودية (9:16) -->
  <div class="video-container">
    <video id="video-a" class="pixel-video active" autoplay muted playsinline></video>
    <video id="video-b" class="pixel-video" autoplay muted playsinline></video>
  </div>

  <!-- حاوية العداد التنازلي في الأسفل -->
  <div class="content-wrapper">
    <div class="countdown-box">
      <div class="countdown-title">الوقت المتبقي لعيد الميلاد (2 مارس)</div>
      <div id="timer" class="timer-display">جاري التحميل...</div>
    </div>
  </div>

 <script src="script.js?v=2"></script>
</body>
</html>
