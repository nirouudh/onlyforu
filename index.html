<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Birthday Countdown - Night</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      background-color: #0d0d12;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px 0;
      font-family: 'Courier New', Courier, monospace;
    }

    /* تكبير الإطار والفيديو معاً مع الحفاظ على التناسق التام وضمان مساحة العداد */
    .outer-frame {
      position: relative;
      height: 82dvh;
      max-height: calc(100dvh - 78px);
      aspect-ratio: 312 / 540;
      max-width: 94vw;
      background-color: #0d0d12;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.9);
      flex-shrink: 1;
      transform: translateZ(0);
    }

    /* شاشة الفيديو الداخلية */
    .video-screen {
      position: absolute;
      top: 11.5%;
      left: 22.5%;
      width: 69%;
      height: 66.5%;
      overflow: hidden;
      background-color: #0d0d12;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* الفيديوهات مع تسريع المعالج الرسومي لمنع الوميض */
    .pixel-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      will-change: opacity;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: none;
    }

    .pixel-video.active {
      opacity: 1;
      z-index: 2;
    }

    /* ==========================================
       طبقة فقاعات المحادثة (iMessage Style)
       ========================================== */
    .chat-overlay {
      position: absolute;
      top: 4%;
      left: 0;
      width: 100%;
      height: 35%;
      padding: 4px 10px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
      z-index: 5;
      pointer-events: none;
      direction: ltr;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .chat-bubble {
      position: relative;
      width: fit-content;
      max-width: 78%;
      padding: 6px 11px;
      border-radius: 15px;
      font-size: clamp(11px, 1.8dvh, 14px);
      line-height: 1.3;
      word-wrap: break-word;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(8px) scale(0.95);
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .chat-bubble.visible {
      opacity: 0.93;
      transform: translateY(0) scale(1);
    }

    .chat-bubble.fade-out {
      opacity: 0 !important;
      transform: translateY(-6px) scale(0.96);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .chat-bubble.character {
      align-self: flex-start;
      background-color: #e5e5ea;
      color: #111111;
      border-bottom-left-radius: 4px;
      margin-left: 4px;
    }

    .chat-bubble.character::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: -5px;
      width: 10px;
      height: 12px;
      background-color: #e5e5ea;
      border-bottom-right-radius: 10px;
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }

    .chat-bubble.user {
      align-self: flex-end;
      background-color: #007aff;
      color: #ffffff;
      border-bottom-right-radius: 4px;
      margin-right: 4px;
    }

    .chat-bubble.user::after {
      content: "";
      position: absolute;
      bottom: 0;
      right: -5px;
      width: 10px;
      height: 12px;
      background-color: #007aff;
      border-bottom-left-radius: 10px;
      clip-path: polygon(0 0, 0 100%, 100% 100%);
    }

    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 14px;
      padding: 0 2px;
    }

    .typing-dots span {
      width: 5px;
      height: 5px;
      background-color: #7a7a80;
      border-radius: 50%;
      animation: typingBounce 1.2s infinite ease-in-out;
    }

    .chat-bubble.user .typing-dots span {
      background-color: rgba(255, 255, 255, 0.85);
    }

    .typing-dots span:nth-child(1) { animation-delay: 0s; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
      30% { transform: translateY(-3px); opacity: 1; }
    }

    /* صورة الإطار PNG */
    .frame-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: fill;
      image-rendering: auto;
      z-index: 6;
      pointer-events: none;
    }

    /* العداد التنازلي أسفل الإطار */
    .content-wrapper {
      margin-top: 10px;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 7;
      flex-shrink: 0;
    }

    .countdown-box {
      position: relative;
      background: rgba(13, 13, 18, 0.9);
      padding: 6px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 182, 193, 0.4);
      text-align: center;
    }

    .countdown-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .countdown-title {
      font-size: 0.72rem;
      color: #ffb74d;
    }

    .audio-toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 182, 193, 0.35);
      color: #ffb74d;
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 0.7rem;
      cursor: pointer;
      line-height: 1.2;
    }

    .audio-toggle-btn:active {
      transform: scale(0.94);
    }

    .timer-display {
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: #fff;
    }

    /* ==========================================
       طبقة الترحيب الضبابية والسبورتين (Onboarding)
       ========================================== */
    .intro-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background: rgba(13, 13, 18, 0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 1;
      transition: opacity 0.55s ease;
    }

    .intro-backdrop.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .intro-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(90vw, 410px);
      gap: 14px;
      opacity: 1;
      transform: scale(1) translateY(0);
      transition: opacity 0.32s ease, transform 0.32s ease;
    }

    .intro-card.switching {
      opacity: 0;
      transform: scale(0.96) translateY(6px);
    }

    .board-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .board-gif {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.55));
    }

    /* صندوق الكتابة المضبوط بدقة داخل المساحة الخضراء للسبورة */
    .board-text {
      position: absolute;
      top: 14.5%;
      left: 10%;
      width: 80%;
      height: 54%;
      padding: 6px 10px 14px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      direction: ltr;
      unicode-bidi: plaintext;
      color: #f8fafc;
      font-family: 'Comic Sans MS', 'Chalkboard SE', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(13px, 3.6vw, 17.5px);
      font-weight: 600;
      line-height: 1.5;
      white-space: pre-line;
      word-wrap: break-word;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    /* زر ok المخصص */
    .btn-success-morph {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      direction: ltr;
      padding: 12px 34px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: #eef2ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
      transition: background 0.3s ease, padding 0.3s ease, transform 0.1s ease;
    }

    .btn-success-morph::after {
      content: "✓";
      display: inline-block;
      width: 0;
      margin-left: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateX(8px);
      transition: width 0.3s ease, margin-left 0.3s ease, opacity 0.25s ease, transform 0.3s ease;
    }

    .btn-success-morph:hover,
    .btn-success-morph:active {
      background: #16a34a;
      padding-left: 22px;
      padding-right: 22px;
    }

    .btn-success-morph:hover::after,
    .btn-success-morph:active::after {
      width: 1em;
      margin-left: 8px;
      opacity: 1;
      transform: translateX(0);
    }

    .btn-success-morph:active {
      background: #15803d;
      transform: translateY(1px);
    }

    .btn-success-morph:focus-visible {
      outline: 2px solid #4f46e5;
      outline-offset: 3px;
    }
  </style>
</head>
<body>

  <!-- طبقة الترحيب الضبابية (السبورة 1 ثم السبورة 2) -->
  <div id="intro-backdrop" class="intro-backdrop">
    <div id="intro-card" class="intro-card">
      <div class="board-wrapper">
        <img id="board-gif" class="board-gif" src="assets/images/intro1.gif" alt="Blackboard">
        <div id="board-text" class="board-text"></div>
      </div>
      <button id="intro-ok-btn" class="btn-success-morph" type="button">ok</button>
    </div>
  </div>

  <!-- الإطار الخارجي الكبير (نافذة Paint) -->
  <div class="outer-frame">
    
    <!-- الإطار الداخلي المخصص للفيديوهات -->
    <div class="video-screen">
      <video id="video-a" class="pixel-video active" muted playsinline webkit-playsinline preload="auto" disablePictureInPicture></video>
      <video id="video-b" class="pixel-video" muted playsinline webkit-playsinline preload="auto" disablePictureInPicture></video>
      
      <!-- حاوية فقاعات المحادثة في الثلث العلوي -->
      <div id="chat-overlay" class="chat-overlay"></div>
    </div>

    <!-- صورة الإطار المفرغة (PNG) -->
    <img src="assets/images/frame.png" alt="Frame" class="frame-overlay">

  </div>

  <!-- عنصر الموسيقى المستقل لفترة المساء -->
  <audio id="evening-audio" preload="auto" loop></audio>

  <!-- العداد التنازلي أسفل الإطار -->
  <div class="content-wrapper">
    <div class="countdown-box">
      <div class="countdown-header">
        <div class="countdown-title">الوقت المتبقي لعيد الميلاد (2 مارس)</div>
        <button id="audio-toggle" class="audio-toggle-btn" title="تفعيل/كتم الصوت">🔊</button>
      </div>
      <div id="timer" class="timer-display">جاري التحميل...</div>
    </div>
  </div>

  <script src="script.js?v=16"></script>
</body>
</html>
