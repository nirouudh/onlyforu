<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Countdown & Pixel World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- حاوية الخلفيات لفترات اليوم (15 دقيقة للدورة الكاملة) -->
  <div class="pixel-background-container">
    <div class="pixel-bg morning" id="bg-morning"></div>
    <div class="pixel-bg evening" id="bg-evening"></div>
    <div class="pixel-bg night" id="bg-night"></div>
  </div>

  <!-- حاوية العناصر الحية والتأثيرات (فانوس، بخار، تموجات) -->
  <div class="effects-layer">
    <div class="lantern-glow"></div>
    <div class="steam-effect"></div>
  </div>

  <!-- محتوى الصفحة: المؤقت والمشهد -->
  <main class="content-wrapper">
    <div class="countdown-box">
      <h2 class="countdown-title">الوَقتُ المَبقِي لِعيدِ الميلاف</h2>
      <div id="timer" class="timer-display">00 : 00 : 00 : 00</div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
